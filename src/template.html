<title>The Davidian Hymnal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: a hymn-board of numbered tiles under a cover banner; tapping a number opens the hymn as a single reading column. */
:root {
  --bg: #f7f3f8;
  --surface: #ffffff;
  --ink: #2a1630;
  --muted: #74607a;
  --line: #e2d6e6;
  --accent: #a3173f;
  --accent-soft: #f6e3ea;
  --plum: #3a1a45;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "EB Garamond", Garamond, "Times New Roman", serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --lyric-size: 1.3rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160d1b; --surface: #21142a; --ink: #f1e7f3; --muted: #ad97b5;
    --line: #36243f; --accent: #e0577c; --accent-soft: #3a1828; --plum: #0f0813;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160d1b; --surface: #21142a; --ink: #f1e7f3; --muted: #ad97b5;
  --line: #36243f; --accent: #e0577c; --accent-soft: #3a1828; --plum: #0f0813;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); -webkit-tap-highlight-color: transparent; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
#q::-webkit-search-cancel-button { -webkit-appearance: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Home ---------- */
.banner {
  position: relative; color: #fbeef3;
  background: #1c0f22 url("__COVER__") center 66% / cover no-repeat;
}
.banner::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(24,10,30,.35), rgba(24,10,30,.88));
}
.banner .wrap { position: relative; z-index: 1; padding-block: 44px 28px; display: grid; gap: 6px; }
.eyebrow { font-family: var(--display); font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; opacity: .85; }
.banner h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 8vw, 3.2rem); letter-spacing: .04em; line-height: 1; }
.motto { font-family: var(--display); font-size: .9rem; letter-spacing: .08em; color: #f1a9bd; }

.searchbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.searchbar .wrap { padding-block: 12px; }
.field { position: relative; }
.field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#q {
  width: 100%; box-sizing: border-box; font: 1.05rem var(--ui); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 42px 13px 42px; appearance: none;
}
#q::placeholder { color: var(--muted); }
#q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 1.4rem; width: 36px; height: 36px; border-radius: 50%; }

.count { font: .78rem var(--ui); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding-block: 16px 10px; }

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; padding-bottom: 40px; }
.tile {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 1.45rem; font-variant-numeric: tabular-nums;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--plum);
  transition: transform .12s, border-color .12s, background .12s;
}
:root[data-theme="dark"] .tile { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile { color: var(--ink); } }
.tile:hover { border-color: var(--accent); color: var(--accent); }
.tile:active { transform: scale(.95); background: var(--accent-soft); }

.results { list-style: none; margin: 0; padding: 0 0 40px; display: grid; }
.results button {
  width: 100%; display: grid; grid-template-columns: 3rem 1fr; gap: 12px; align-items: baseline;
  text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 4px;
}
.results .num { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 1.15rem; text-align: right; font-variant-numeric: tabular-nums; }
.results .t { font-size: 1.2rem; min-width: 0; }
.results .sub { display: block; font: .82rem var(--ui); color: var(--muted); margin-top: 2px; }
.results mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { padding: 40px 4px; color: var(--muted); font-size: 1.15rem; }

/* ---------- Song ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.iconbtn {
  border: 1px solid transparent; background: none; border-radius: 10px; min-width: 42px; height: 42px;
  display: inline-grid; place-items: center; font: 600 .95rem var(--ui); color: var(--ink); padding: 0 10px;
}
.iconbtn:hover { border-color: var(--line); background: var(--surface); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn svg { width: 20px; height: 20px; }
.spacer { flex: 1; }
.topnum { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: 1.05rem; letter-spacing: .06em; }

.song { padding-block: 28px 56px; }
.song header { display: grid; gap: 8px; padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.bignum { font-family: var(--display); font-weight: 700; font-size: 3.4rem; line-height: 1; color: var(--accent); }
.song h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.2; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: .88rem var(--ui); color: var(--muted); }
.meta b { font-weight: 600; color: var(--ink); }

.stanzas { display: grid; gap: 26px; max-width: 34em; }
.stanza { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; font-size: var(--lyric-size); line-height: 1.5; }
.stanza .lbl { font-family: var(--display); font-weight: 700; color: var(--accent); font-size: .85em; padding-top: .12em; text-align: right; }
.stanza p { margin: 0; min-width: 0; }
.stanza.chorus { row-gap: 4px; }
.stanza.chorus p { grid-column: 2; font-style: italic; padding-left: 16px; border-left: 2px solid var(--accent-soft); }
.stanza.chorus .lbl { grid-column: 2; text-align: left; font-size: .6em; letter-spacing: .16em; text-transform: uppercase; padding: 0 0 0 18px; }

.pager { display: flex; gap: 12px; margin-top: 44px; }
.pager button {
  flex: 1; min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px;
}
.pager button.next { text-align: right; }
.pager small { font: .72rem var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pager span { font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager button:hover { border-color: var(--accent); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="home">
  <section class="banner">
    <div class="wrap">
      <span class="eyebrow">The Davidian</span>
      <h1>Hymnal</h1>
      <span class="motto">Hear Ye The Rod · Sing Ye The Rod</span>
    </div>
  </section>
  <div class="searchbar">
    <div class="wrap">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Search by title or number" aria-label="Search hymns by title or number">
        <button id="clear" aria-label="Clear search" hidden>×</button>
      </div>
    </div>
  </div>
  <main class="wrap">
    <div class="count" id="count"></div>
    <div class="board" id="board"></div>
    <ul class="results" id="results" hidden></ul>
    <p class="empty" id="empty" hidden></p>
  </main>
</div>

<div id="reader" hidden>
  <div class="topbar">
    <div class="wrap">
      <button class="iconbtn" id="back" aria-label="Back to all hymns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="topnum" id="topnum"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="smaller" aria-label="Smaller text">A−</button>
      <button class="iconbtn" id="bigger" aria-label="Larger text">A+</button>
    </div>
  </div>
  <article class="wrap song" id="song"></article>
</div>

<script>
const SONGS = __SONGS__;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’‘']/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
SONGS.forEach(s => { s.key = norm(s.title + ' ' + s.caps); });

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- Home ---------- */
$('board').innerHTML = SONGS.map(s =>
  `<button class="tile" data-n="${s.n}" title="${esc(s.title)}" aria-label="${s.n}. ${esc(s.title)}">${s.n}</button>`).join('');
$('count').textContent = `${SONGS.length} hymns`;

function highlight(title, q) {
  if (!q) return esc(title);
  const words = q.split(' ').filter(w => w && !/^\d+$/.test(w));
  let out = esc(title);
  for (const w of words) {
    const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    out = out.replace(re, '<mark>$1</mark>');
  }
  return out;
}

function search() {
  const raw = $('q').value;
  const q = norm(raw);
  $('clear').hidden = !raw;
  if (!q) {
    $('board').hidden = false; $('results').hidden = true; $('empty').hidden = true;
    $('count').textContent = `${SONGS.length} hymns`;
    return;
  }
  const words = q.split(' ');
  const hits = SONGS.filter(s =>
    /^\d+$/.test(q) ? String(s.n).startsWith(q) : words.every(w => s.key.includes(w)));
  $('board').hidden = true;
  $('results').hidden = !hits.length;
  $('empty').hidden = !!hits.length;
  $('empty').textContent = `No hymn titles match “${raw.trim()}”.`;
  $('count').textContent = `${hits.length} ${hits.length === 1 ? 'match' : 'matches'}`;
  $('results').innerHTML = hits.map(s => `<li><button data-n="${s.n}">
    <span class="num">${s.n}</span>
    <span class="t">${highlight(s.title, q)}<span class="sub">${esc(s.ref || '')}${s.ref && s.tune ? ' · ' : ''}${s.tune ? 'Tune: ' + esc(s.tune) : ''}</span></span>
  </button></li>`).join('');
}
$('q').addEventListener('input', search);
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = document.querySelector('#results button');
  if (first) open(+first.dataset.n);
});
$('clear').addEventListener('click', () => { $('q').value = ''; search(); $('q').focus(); });
document.addEventListener('click', e => {
  const b = e.target.closest('.tile, #results button, .pager button');
  if (b && b.dataset.n) open(+b.dataset.n);
});

/* ---------- Reader ---------- */
let size = parseFloat(store.get('lyricSize')) || 1.3;
const applySize = () => document.documentElement.style.setProperty('--lyric-size', size + 'rem');
applySize();
$('smaller').onclick = () => { size = Math.max(1, +(size - .1).toFixed(2)); applySize(); store.set('lyricSize', size); };
$('bigger').onclick = () => { size = Math.min(2.4, +(size + .1).toFixed(2)); applySize(); store.set('lyricSize', size); };

// Each opened hymn gets a history entry, so the phone's back gesture returns to the list instead of leaving the app.
let homeScroll = 0;
const songFromHash = () => { const m = /^#h(\d+)$/.exec(location.hash); return m ? +m[1] : 0; };
function render(n) {
  const s = SONGS[n - 1];
  const prev = SONGS[n - 2], next = SONGS[n];
  $('topnum').textContent = `No. ${s.n}`;
  $('song').innerHTML = `
    <header>
      <span class="bignum">${s.n}</span>
      <h2>${esc(s.title)}</h2>
      <div class="meta">
        ${s.ref ? `<span><b>Text:</b> ${esc(s.ref)}</span>` : ''}
        ${s.tune ? `<span><b>Tune:</b> ${esc(s.tune)}</span>` : ''}
      </div>
    </header>
    <div class="stanzas">
      ${s.sections.map(sec => `<div class="stanza${sec.label === 'Chorus' ? ' chorus' : ''}">
        <span class="lbl">${sec.label === 'Chorus' ? 'Chorus' : sec.label}</span>
        <p>${sec.lines.map(esc).join('<br>')}</p>
      </div>`).join('')}
    </div>
    <nav class="pager">
      ${prev ? `<button data-n="${prev.n}"><small>← No. ${prev.n}</small><span>${esc(prev.title)}</span></button>` : '<span style="flex:1"></span>'}
      ${next ? `<button class="next" data-n="${next.n}"><small>No. ${next.n} →</small><span>${esc(next.title)}</span></button>` : '<span style="flex:1"></span>'}
    </nav>`;
}
function show(n) {
  if (!SONGS[n - 1]) return false;
  if (!$('home').hidden) homeScroll = window.scrollY;
  render(n);
  $('home').hidden = true; $('reader').hidden = false;
  window.scrollTo(0, 0);
  return true;
}
function showHome() {
  $('reader').hidden = true; $('home').hidden = false;
  window.scrollTo(0, homeScroll);
}
function open(n) {
  const fromHome = !$('home').hidden;
  if (!show(n)) return;
  try {
    if (fromHome) history.pushState({ song: n }, '', '#h' + n);
    else history.replaceState({ song: n }, '', '#h' + n);
  } catch {}
}
function close() {
  if (history.state && history.state.song) { history.back(); return; }
  showHome();
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
}
window.addEventListener('popstate', () => { const n = songFromHash(); if (!n || !show(n)) showHome(); });
$('back').onclick = close;
document.addEventListener('keydown', e => {
  if ($('reader').hidden) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    return;
  }
  const n = +$('topnum').textContent.replace(/\D/g, '');
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') open(n + 1);
  if (e.key === 'ArrowLeft') open(n - 1);
});

if (songFromHash()) show(songFromHash());

if ('serviceWorker' in navigator && location.protocol !== 'file:' && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
