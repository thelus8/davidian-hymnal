<title>The Davidian Hymnal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: an app shell. Cover card + frosted search bar over a numeral grid; side sheets list every hymn and the
   service list; the reader is one calm column with chorus cards; presentation mode is a full-screen slide stage. */
:root {
  --bg: #f8f6fb;
  --surface: #ffffff;
  --surface-2: #f1ecf6;
  --ink: #1d1424;
  --muted: #6f6478;
  --line: rgba(45, 20, 70, .1);
  --accent: #b0194a;
  --accent-soft: rgba(176, 25, 74, .09);
  --glass: rgba(248, 246, 251, .74);
  --glow: rgba(176, 25, 74, .09);
  --shadow: 0 1px 2px rgba(30, 10, 40, .04), 0 8px 24px rgba(30, 10, 40, .06);
  --stage: #0b0710;
  --stage-ink: #f6eff8;
  --stage-accent: #ff8fb0;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --lyric: "Newsreader", "Iowan Old Style", Georgia, serif;
  --ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --lyric-size: 1.3rem;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0a12; --surface: #18121e; --surface-2: #211929; --ink: #f3eef6; --muted: #a497ad;
    --line: rgba(255, 255, 255, .08); --accent: #ff6b94; --accent-soft: rgba(255, 107, 148, .12);
    --glass: rgba(14, 10, 18, .72); --glow: rgba(255, 107, 148, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0a12; --surface: #18121e; --surface-2: #211929; --ink: #f3eef6; --muted: #a497ad;
  --line: rgba(255, 255, 255, .08); --accent: #ff6b94; --accent-soft: rgba(255, 107, 148, .12);
  --glass: rgba(14, 10, 18, .72); --glow: rgba(255, 107, 148, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(900px 420px at 50% -160px, var(--glow), transparent 70%) no-repeat, var(--bg);
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 780px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; }

.round {
  width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--ink);
  transition: transform .15s, border-color .15s;
}
.round:hover { border-color: var(--accent); }
.round:active { transform: scale(.94); }
.round.sm { width: 34px; height: 34px; }
.round.sm svg { width: 16px; height: 16px; }
.round:disabled { opacity: .3; cursor: default; border-color: var(--line); }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--glass); border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
}
.bar .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }

.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 500 .88rem var(--ui); white-space: nowrap;
}
.pill svg { width: 17px; height: 17px; flex: none; }
.pill:hover { border-color: var(--accent); }
.pill[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.pill[aria-pressed="true"] .fill { fill: currentColor; }
.pill.primary { background: var(--accent); border-color: transparent; color: #fff; }
.pill.quiet { background: none; border-color: transparent; color: var(--muted); }
.pill:disabled { opacity: .4; cursor: default; }

/* ---------- Home ---------- */
.hero { padding-block: 16px 14px; display: grid; gap: 10px; }
.cover {
  position: relative; overflow: hidden; border-radius: 24px; min-height: 196px; color: #fff;
  display: flex; flex-direction: column; justify-content: flex-end; padding: 22px 22px 20px;
  /* zoomed so only the piano band (between the cover's printed title and motto) shows */
  background: #1c0f22 url("__COVER__") 50% 64% / 160% auto no-repeat; box-shadow: var(--shadow);
}
.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(20, 8, 28, .15) 0%, rgba(20, 8, 28, .82) 75%); }
.cover > * { position: relative; }
.cover .count-pill {
  position: absolute; top: 16px; right: 16px; font: 500 .75rem var(--ui); letter-spacing: .04em;
  padding: 6px 11px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .2);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.cover .eyebrow { font: 500 .72rem var(--ui); letter-spacing: .22em; text-transform: uppercase; opacity: .8; }
.cover h1 { margin: 2px 0 4px; font: 400 clamp(2.9rem, 11vw, 3.8rem)/.95 var(--display); letter-spacing: -.01em; }
.cover .motto { font: italic 400 1rem var(--lyric); opacity: .85; }

.card {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; box-sizing: border-box;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow);
}
.card .badge { font: 600 .9rem var(--ui); font-variant-numeric: tabular-nums; color: var(--accent); background: var(--accent-soft); border-radius: 10px; min-width: 2.6rem; padding: 7px 0; text-align: center; display: grid; place-items: center; }
.card .badge svg { width: 18px; height: 18px; }
.card small { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card .t { font: 500 1.05rem var(--lyric); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.card > div { min-width: 0; flex: 1; }
.card.notice { background: var(--accent-soft); border-color: transparent; box-shadow: none; flex-wrap: wrap; }
.card.notice .btns { display: flex; gap: 6px; }

.field { position: relative; flex: 1; min-width: 0; }
.field > svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#q {
  width: 100%; box-sizing: border-box; height: 44px; font: 400 1rem var(--ui); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 42px 0 44px; appearance: none;
}
#q::-webkit-search-cancel-button { -webkit-appearance: none; }
#q::placeholder { color: var(--muted); }
#q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
#clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); border: 0; background: var(--surface-2); color: var(--muted); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
#clear svg { width: 14px; height: 14px; }

.section-label { display: flex; justify-content: space-between; align-items: baseline; padding-block: 18px 10px; font: 500 .75rem var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); font: 500 .8rem var(--ui); letter-spacing: 0; text-transform: none; padding: 4px 0; }

.favs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px 4px; }
.favs::-webkit-scrollbar { display: none; }
.fav {
  flex: none; display: inline-flex; align-items: center; gap: 9px; max-width: 240px; height: 44px; padding: 0 14px 0 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
}
.fav .num-badge { min-width: 2.1rem; padding: 5px 0; }
.fav span.t { font: 500 1rem var(--lyric); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav:hover { border-color: var(--accent); }

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 10px; padding-bottom: 48px; }
.tile {
  position: relative; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font: 400 1.9rem/1 var(--display); font-variant-numeric: lining-nums tabular-nums;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink);
  box-shadow: 0 1px 2px rgba(30, 10, 40, .03);
  transition: transform .15s, border-color .15s, background .15s, color .15s;
}
.tile.starred::after { content: ""; position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.tile:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.tile:active { transform: scale(.95); background: var(--accent-soft); }

.results { list-style: none; margin: 0; padding: 0 0 48px; display: grid; gap: 8px; }
.results .group { font: 500 .75rem var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 2px 2px; }
.row {
  width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px 14px;
}
.row:hover { border-color: var(--accent); }
.num-badge { font: 600 .9rem var(--ui); font-variant-numeric: tabular-nums; color: var(--accent); background: var(--accent-soft); border-radius: 10px; min-width: 2.6rem; padding: 7px 0; text-align: center; }
.row .t { font: 500 1.12rem/1.3 var(--lyric); min-width: 0; }
.row .sub { display: block; font: 400 .8rem var(--ui); color: var(--muted); margin-top: 3px; }
.row .quote { display: block; font: italic 400 .98rem/1.35 var(--lyric); color: var(--muted); margin-top: 3px; }
.row mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 2px; }
.empty { padding: 48px 4px; color: var(--muted); text-align: center; font: italic 1.15rem var(--lyric); }

/* ---------- Reader ---------- */
.reader-bar .label { flex: 1; min-width: 0; text-align: center; font: 600 .9rem var(--ui); font-variant-numeric: tabular-nums; }
.reader-bar .label small { display: block; font: 400 .75rem var(--ui); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sizer { display: inline-flex; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 44px; flex: none; }
.sizer button { border: 0; background: none; width: 40px; font: 600 .82rem var(--ui); }
.sizer button + button { border-left: 1px solid var(--line); font-size: 1rem; }

.song { padding-block: 22px 40px; }
.svc-strip {
  display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent);
  border-radius: 14px; padding: 6px 6px 6px 14px; margin-bottom: 18px; font: 500 .85rem var(--ui);
}
.svc-strip span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svc-strip button { border: 0; background: var(--surface); color: var(--accent); border-radius: 10px; height: 34px; padding: 0 12px; font: 600 .82rem var(--ui); }
.svc-strip button:disabled { opacity: .4; cursor: default; }
.song header { display: grid; gap: 10px; padding-bottom: 22px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.bignum { font: italic 400 4.5rem/.9 var(--display); color: var(--accent); font-variant-numeric: lining-nums; }
.song h2 { margin: 0; font: 400 clamp(2rem, 7vw, 2.7rem)/1.05 var(--display); text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 .8rem var(--ui); color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; }
.chip svg { width: 14px; height: 14px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

.stanzas { display: grid; gap: 22px; max-width: 34em; }
.stanza { display: grid; grid-template-columns: 1.9rem 1fr; gap: 12px; font: 400 var(--lyric-size)/1.55 var(--lyric); }
.stanza .vn { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; margin-top: .22em; font: 600 .75rem var(--ui); color: var(--accent); background: var(--accent-soft); }
.stanza p { margin: 0; min-width: 0; }
.chorus { display: block; font: 400 var(--lyric-size)/1.55 var(--lyric); background: var(--surface-2); border-radius: var(--radius); padding: 16px 18px 18px; margin-left: calc(1.9rem + 12px); }
.chorus .clabel { display: block; font: 600 .7rem var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.chorus p { margin: 0; font-style: italic; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 44px; }
.pager button {
  min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 3px;
}
.pager button.next { text-align: right; grid-column: 2; }
.pager button:hover { border-color: var(--accent); }
.pager small { font: 500 .72rem var(--ui); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.pager span { font: 500 1.02rem var(--lyric); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { margin-top: 18px; text-align: center; font: 400 .78rem var(--ui); color: var(--muted); }

/* ---------- Sheets and dialogs ---------- */
dialog.sheet {
  box-sizing: border-box; padding: 0; border: 0; color: var(--ink); background: var(--surface);
  width: min(420px, 100%); max-width: 100%; height: 100%; max-height: 100%;
  margin: 0 0 0 auto; box-shadow: -20px 0 60px rgba(0, 0, 0, .25);
}
dialog.sheet[open] { display: flex; flex-direction: column; animation: slide-in .28s cubic-bezier(.2, .8, .2, 1); }
dialog::backdrop { background: rgba(10, 6, 14, .45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
@keyframes slide-in { from { transform: translateX(40px); opacity: 0; } }
@keyframes rise { from { transform: translateY(24px) scale(.98); opacity: 0; } }
@media (max-width: 599px) {
  dialog.sheet { width: 100%; height: 90%; margin: auto 0 0; border-radius: 24px 24px 0 0; box-shadow: 0 -20px 60px rgba(0, 0, 0, .25); }
  @keyframes slide-in { from { transform: translateY(60px); opacity: 0; } }
}
.sheet-head {
  display: grid; gap: 14px; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 14px max(18px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line);
}
.sheet-head .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h3 { margin: 0; font: 400 2rem/1 var(--display); }
.sheet-head h3 small { font: 500 .8rem var(--ui); color: var(--muted); margin-left: 6px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 7px 12px; font: 500 .82rem var(--ui); color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.toc, .svc-list { list-style: none; margin: 0; padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px)); overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.toc:focus { outline: none; }
.toc button {
  width: 100%; display: grid; grid-template-columns: 2.6rem 1fr auto; gap: 10px; align-items: baseline; text-align: left;
  border: 0; background: none; border-radius: 12px; padding: 11px 8px;
}
.toc button:hover { background: var(--surface-2); }
.toc .n { font: 600 .9rem var(--ui); font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.toc .t { font: 400 1.1rem/1.3 var(--lyric); min-width: 0; }
.toc .star { color: var(--accent); font-size: .8rem; }
.toc button[aria-current="true"] { background: var(--accent-soft); }
.toc button[aria-current="true"] .n, .toc button[aria-current="true"] .t { color: var(--accent); }
.toc .letter { font: 600 .72rem var(--ui); letter-spacing: .12em; color: var(--accent); padding: 14px 10px 4px; }
.toc .none, .svc-list .none { padding: 40px 16px; text-align: center; color: var(--muted); font: italic 1.05rem/1.5 var(--lyric); }
.sheet-foot {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--line);
  padding: 12px max(18px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  font: 500 .8rem var(--ui); color: var(--muted);
}

.addnum { display: flex; gap: 8px; }
.addnum input {
  flex: 1; min-width: 0; height: 40px; box-sizing: border-box; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 999px; padding: 0 16px; font: 400 1rem var(--ui);
}
.addnum input:focus { outline: none; border-color: var(--accent); }
.svc-list li.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; }
.svc-list li.item:hover { background: var(--surface-2); }
.svc-list .order { font: 500 .78rem var(--ui); color: var(--muted); width: 1.2rem; text-align: right; font-variant-numeric: tabular-nums; }
.svc-list .open { display: flex; align-items: center; gap: 10px; min-width: 0; border: 0; background: none; text-align: left; padding: 0; }
.svc-list .open .t { font: 400 1.08rem/1.3 var(--lyric); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svc-list .ctl { display: flex; gap: 4px; }
.svc-list .ctl .round { border-color: transparent; background: none; }
.svc-list .ctl .round:hover { background: var(--surface); border-color: var(--line); }
.svc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }

dialog.pad {
  box-sizing: border-box; width: min(340px, calc(100% - 32px)); border: 0; border-radius: 26px; padding: 18px 18px 20px;
  background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
}
dialog.pad[open] { animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
.pad-top { display: flex; justify-content: space-between; align-items: center; font: 500 .75rem var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pad-display { font: 400 4rem/1 var(--display); text-align: center; color: var(--accent); min-height: 4rem; margin-top: 6px; font-variant-numeric: lining-nums; }
.pad-title { text-align: center; font: 500 1.05rem var(--lyric); color: var(--muted); min-height: 1.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.keys button { height: 62px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-2); font: 400 2rem/1 var(--display); display: grid; place-items: center; }
.keys button:active { transform: scale(.96); }
.keys .go { background: var(--accent); color: #fff; border-color: transparent; font: 600 1rem var(--ui); }
.keys .go:disabled { opacity: .35; cursor: default; }
.keys .back svg { width: 24px; height: 24px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font: 500 .88rem var(--ui); box-shadow: var(--shadow);
  max-width: calc(100% - 32px); box-sizing: border-box; text-align: center;
}

/* ---------- Presentation ---------- */
#present {
  position: fixed; inset: 0; z-index: 50; background: var(--stage); color: var(--stage-ink); display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  user-select: none; -webkit-user-select: none;
}
.p-top, .p-bottom { display: flex; align-items: center; gap: 12px; padding: 12px 18px; font: 500 .85rem var(--ui); color: rgba(246, 239, 248, .55); }
.p-top span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .06); color: var(--stage-ink); display: grid; place-items: center; flex: none; }
.p-btn:hover { background: rgba(255, 255, 255, .12); }
.p-btn:disabled { opacity: .25; cursor: default; }
.p-stage { flex: 1; min-height: 0; position: relative; padding: 1vh 6vw; cursor: pointer; }
.p-fit { width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: var(--lyric); line-height: 1.32; }
.p-label { font: 600 .32em var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--stage-accent); margin-bottom: .7em; }
.p-lines.it { font-style: italic; }
.p-num { font: italic 400 2.2em/1 var(--display); color: var(--stage-accent); }
.p-title { font: 400 1.25em/1.05 var(--display); margin: .15em 0 .4em; text-wrap: balance; }
.p-meta { font: 400 .38em var(--ui); color: rgba(246, 239, 248, .6); }
.p-progress { flex: 1; height: 3px; background: rgba(255, 255, 255, .12); border-radius: 3px; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<div class="toast" id="toast" role="status" hidden></div>

<script>
const SONGS = __SONGS__;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’‘']/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
// Sort key for A to Z: ignore a leading "The"/"A" so "The Shaking" files under S
const sortKey = t => norm(t).replace(/^(the|a|an) /, '');
SONGS.forEach(s => {
  s.key = norm(s.title + ' ' + s.caps);
  s.lyricLines = s.sections.flatMap(sec => sec.lines.map(l => ({ raw: l, n: norm(l) })));
  s.lyricKey = s.lyricLines.map(l => l.n).join(' ');
});
const song = n => SONGS[n - 1];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  json(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } },
};
let toastTimer;
function toast(msg) {
  $('toast').textContent = msg; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2600);
}

// Sung order: the chorus is repeated after every verse
function sungOrder(s) {
  const chorus = s.sections.find(x => x.label === 'Chorus');
  if (!chorus) return s.sections;
  return s.sections.filter(x => x.label !== 'Chorus').flatMap(v => [v, chorus]);
}

/* ---------- Saved state ---------- */
const favs = new Set(store.json('favs', []).filter(n => song(n)));
let service = store.json('service', []).filter(n => song(n));
let repeatChorus = store.get('repeat') === '1';
const saveFavs = () => store.set('favs', JSON.stringify([...favs]));
const saveService = () => store.set('service', JSON.stringify(service));

/* ---------- Appearance ---------- */
function applyTheme(pick) {
  if (pick === 'light' || pick === 'dark') document.documentElement.dataset.theme = pick;
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-theme-pick]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themePick === (pick || 'system')));
}
const savedTheme = store.get('theme');
if (savedTheme) applyTheme(savedTheme);
document.querySelectorAll('[data-theme-pick]').forEach(b => b.onclick = () => { applyTheme(b.dataset.themePick); store.set('theme', b.dataset.themePick); });

/* ---------- Keep the screen on while a hymn is open ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch { wakeLock = null; }
}
// The system drops the lock when the app is hidden; take it again on return
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (!$('reader').hidden || !$('present').hidden)) keepAwake(true);
});

/* ---------- Home ---------- */
$('countPill').textContent = `${SONGS.length} hymns`;
function renderBoard() {
  $('board').innerHTML = SONGS.map(s =>
    `<button class="tile${favs.has(s.n) ? ' starred' : ''}" data-n="${s.n}" title="${esc(s.title)}" aria-label="${s.n}. ${esc(s.title)}${favs.has(s.n) ? ' (favorite)' : ''}">${s.n}</button>`).join('');
}
function renderFavs() {
  const list = [...favs].sort((a, b) => a - b);
  $('favSection').hidden = !list.length || !!$('q').value;
  $('favs').innerHTML = list.map(n => `<button class="fav" data-n="${n}"><span class="num-badge">${n}</span><span class="t">${esc(song(n).title)}</span></button>`).join('');
}
function renderHomeCards() {
  const last = song(+store.get('last') || 0);
  $('continue').hidden = !last;
  if (last) { $('continue').dataset.n = last.n; $('contNum').textContent = last.n; $('contTitle').textContent = last.title; }
  $('svcCard').hidden = !service.length;
  $('svcCardText').textContent = `${service.length} ${service.length === 1 ? 'hymn' : 'hymns'}: ${service.join(', ')}`;
}
function renderHome() { renderBoard(); renderFavs(); renderHomeCards(); }
renderHome();
$('count').textContent = 'Choose a number';

function highlight(text, q) {
  let out = esc(text);
  for (const w of q.split(' ').filter(w => w && !/^\d+$/.test(w))) {
    out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
  }
  return out;
}

function search() {
  const raw = $('q').value;
  const q = norm(raw);
  $('clear').hidden = !raw;
  $('seeAll').hidden = !!q;
  renderFavs();
  if (!q) {
    $('board').hidden = false; $('results').hidden = true; $('empty').hidden = true;
    $('count').textContent = 'Choose a number';
    return;
  }
  const words = q.split(' ');
  let titleHits, wordHits = [];
  if (/^\d+$/.test(q)) titleHits = SONGS.filter(s => String(s.n).startsWith(q));
  else {
    titleHits = SONGS.filter(s => words.every(w => s.key.includes(w)));
    wordHits = SONGS.filter(s => !titleHits.includes(s) && words.every(w => s.lyricKey.includes(w))).map(s => {
      // show the line that contains the most of the search words
      const best = s.lyricLines.reduce((a, l) => {
        const score = words.filter(w => l.n.includes(w)).length;
        return score > a.score ? { score, line: l.raw } : a;
      }, { score: -1, line: '' });
      return { s, line: best.line };
    });
  }
  const total = titleHits.length + wordHits.length;
  $('board').hidden = true;
  $('results').hidden = !total;
  $('empty').hidden = !!total;
  $('empty').textContent = `No hymn titles or words match “${raw.trim()}”.`;
  $('count').textContent = `${total} ${total === 1 ? 'match' : 'matches'}`;
  const sub = s => `${esc(s.ref || '')}${s.ref && s.tune ? ' · ' : ''}${s.tune ? 'Tune: ' + esc(s.tune) : ''}`;
  $('results').innerHTML =
    (titleHits.length && wordHits.length ? '<li class="group">In the title</li>' : '') +
    titleHits.map(s => `<li><button class="row" data-n="${s.n}"><span class="num-badge">${s.n}</span>
      <span class="t">${highlight(s.title, q)}<span class="sub">${sub(s)}</span></span></button></li>`).join('') +
    (wordHits.length ? '<li class="group">In the words</li>' : '') +
    wordHits.map(({ s, line }) => `<li><button class="row" data-n="${s.n}"><span class="num-badge">${s.n}</span>
      <span class="t">${esc(s.title)}<span class="quote">“${highlight(line, q)}”</span></span></button></li>`).join('');
}
$('q').addEventListener('input', search);
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = document.querySelector('#results button');
  if (first) open(+first.dataset.n);
});
$('clear').addEventListener('click', () => { $('q').value = ''; search(); $('q').focus(); });

/* ---------- Dialogs ---------- */
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d) d.close(); });
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
});
const closeDialogs = () => document.querySelectorAll('dialog[open]').forEach(d => d.close());

/* ---------- All hymns sheet ---------- */
let sortBy = ['az', 'fav'].includes(store.get('sort')) ? store.get('sort') : 'num';
let current = 0;
function renderToc() {
  document.querySelectorAll('[data-sort]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sort === sortBy));
  $('sheetCount').textContent = sortBy === 'fav' ? favs.size : SONGS.length;
  let list = SONGS;
  if (sortBy === 'az') list = [...SONGS].sort((a, b) => sortKey(a.title).localeCompare(sortKey(b.title)));
  if (sortBy === 'fav') list = SONGS.filter(s => favs.has(s.n));
  if (!list.length) {
    $('toc').innerHTML = '<li class="none">No favorites yet.<br>Open a hymn and tap Favorite to keep it here.</li>';
    return;
  }
  let letter = '';
  $('toc').innerHTML = list.map(s => {
    let head = '';
    if (sortBy === 'az') {
      const l = sortKey(s.title)[0].toUpperCase();
      if (l !== letter) { letter = l; head = `<li class="letter" aria-hidden="true">${l}</li>`; }
    }
    return `${head}<li><button data-n="${s.n}" aria-current="${s.n === current}"><span class="n">${s.n}</span><span class="t">${esc(s.title)}</span>${favs.has(s.n) && sortBy !== 'fav' ? '<span class="star" aria-label="favorite">★</span>' : '<span></span>'}</button></li>`;
  }).join('');
}
function openSheet() {
  renderToc();
  $('sheet').showModal();
  const cur = $('toc').querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'center' }); else $('toc').scrollTop = 0;
}
document.querySelectorAll('[data-contents]').forEach(b => b.onclick = openSheet);
document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { sortBy = b.dataset.sort; store.set('sort', sortBy); renderToc(); $('toc').scrollTop = 0; });

/* ---------- Number keypad ---------- */
let padVal = '';
const maxDigits = String(SONGS.length).length;
function renderPad() {
  const s = song(+padVal);
  $('padDisplay').textContent = padVal || '–';
  $('padTitle').textContent = s ? s.title : padVal ? 'No hymn with that number' : `Type 1 to ${SONGS.length}`;
  $('padGo').disabled = !s;
}
function padKey(k) {
  if (k === 'del') padVal = padVal.slice(0, -1);
  else if (k === 'go') { const s = song(+padVal); if (s) { $('pad').close(); open(s.n); } return; }
  else if (padVal.length < maxDigits) padVal = (padVal + k).replace(/^0+/, '');
  renderPad();
}
document.querySelectorAll('[data-pad]').forEach(b => b.onclick = () => { padVal = ''; renderPad(); $('pad').showModal(); });
$('keys').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) padKey(b.dataset.k); });
$('pad').addEventListener('keydown', e => {
  if (/^\d$/.test(e.key)) padKey(e.key);
  else if (e.key === 'Backspace') padKey('del');
  else if (e.key === 'Enter') { e.preventDefault(); padKey('go'); }
});

/* ---------- Service list ---------- */
function renderService() {
  $('svcCount').textContent = service.length || '';
  $('svcList').innerHTML = service.length ? service.map((n, i) => `<li class="item">
      <span class="order">${i + 1}</span>
      <button class="open" data-svc-open="${i}"><span class="num-badge">${n}</span><span class="t">${esc(song(n).title)}</span></button>
      <span class="ctl">
        <button class="round sm" data-svc-move="${i},-1" aria-label="Move up" ${i ? '' : 'disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button class="round sm" data-svc-move="${i},1" aria-label="Move down" ${i < service.length - 1 ? '' : 'disabled'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="round sm" data-svc-remove="${i}" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </span></li>`).join('')
    : '<li class="none">No hymns yet.<br>Add one by number above, or open a hymn and tap Add to service.</li>';
  ['svcStart', 'svcPresent', 'svcShare', 'svcClear'].forEach(id => { $(id).disabled = !service.length; });
}
function setService(list) { service = list; saveService(); renderService(); renderHomeCards(); }
function openService() { renderService(); $('svcSheet').showModal(); }
document.querySelectorAll('[data-service]').forEach(b => b.onclick = openService);
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const n = +$('addNum').value.trim();
  if (!song(n)) { toast(`There is no hymn ${$('addNum').value.trim() || 'number'}. Use 1 to ${SONGS.length}.`); return; }
  if (service.includes(n)) { $('addNum').value = ''; toast(`No. ${n} is already in the list`); return; }
  setService([...service, n]);
  $('addNum').value = '';
  toast(`Added No. ${n}`);
});
$('svcList').addEventListener('click', e => {
  const o = e.target.closest('[data-svc-open]'), m = e.target.closest('[data-svc-move]'), r = e.target.closest('[data-svc-remove]');
  if (o) { $('svcSheet').close(); open(service[+o.dataset.svcOpen], +o.dataset.svcOpen); }
  if (m) {
    const [i, d] = m.dataset.svcMove.split(',').map(Number), list = [...service];
    [list[i], list[i + d]] = [list[i + d], list[i]];
    setService(list);
  }
  if (r) setService(service.filter((_, i) => i !== +r.dataset.svcRemove));
});
$('svcStart').onclick = () => { $('svcSheet').close(); open(service[0], 0); };
$('svcPresent').onclick = () => { $('svcSheet').close(); present(service); };
$('svcClear').onclick = () => { setService([]); toast('Service list cleared'); };

const shareUrl = () => location.href.split('#')[0] + '#s' + service.join('-');
$('svcShare').onclick = async () => {
  const url = shareUrl(), text = `Hymns for the service: ${service.join(', ')}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Service list', text, url }); return; } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('Link copied. Paste it into a message.'); }
  catch { $('addNum').value = url; $('addNum').select(); toast('Copy the link from the box above'); }
};

// Opening a shared link (#s12-4-33) offers that list
let pendingShared = null;
function checkSharedLink() {
  const m = /^#s(\d+(?:-\d+)*)$/.exec(location.hash);
  if (!m) return;
  const list = [...new Set(m[1].split('-').map(Number))].filter(n => song(n));
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  if (!list.length || list.join() === service.join()) return;
  if (!service.length) { setService(list); toast(`Service list loaded: ${list.length} hymns`); }
  else { pendingShared = list; $('sharedText').textContent = `${list.length} hymns: ${list.join(', ')}`; $('shared').hidden = false; }
  if ($('home').hidden) showHome();
}
checkSharedLink();
addEventListener('hashchange', checkSharedLink);
$('sharedYes').onclick = () => { setService(pendingShared); $('shared').hidden = true; openService(); };
$('sharedNo').onclick = () => { $('shared').hidden = true; };

/* ---------- Reader ---------- */
let size = parseFloat(store.get('lyricSize')) || 1.3;
const applySize = () => document.documentElement.style.setProperty('--lyric-size', size + 'rem');
applySize();
$('smaller').onclick = () => { size = Math.max(1, +(size - .1).toFixed(2)); applySize(); store.set('lyricSize', size); };
$('bigger').onclick = () => { size = Math.min(2.4, +(size + .1).toFixed(2)); applySize(); store.set('lyricSize', size); };

const icons = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path class="fill" d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h8M3 6h.01M3 12h.01M3 18h.01M19 15v6M16 18h6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  screen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
};

let svcPos = -1;   // position in the service list when reading through it, otherwise -1
function render(n) {
  const s = song(n);
  const prev = song(n - 1), next = song(n + 1);
  const hasChorus = s.sections.some(x => x.label === 'Chorus');
  const sections = repeatChorus ? sungOrder(s) : s.sections;
  const inService = service.includes(n);
  current = n;
  const svcNext = svcPos >= 0 ? song(service[svcPos + 1]) : null;
  $('topLabel').innerHTML = `No. ${s.n}<small>${esc(s.title)}</small>`;
  $('song').innerHTML = `
    ${svcPos >= 0 ? `<div class="svc-strip">
      <span>Service · ${svcPos + 1} of ${service.length}${svcNext ? ` · Next: No. ${svcNext.n}` : ''}</span>
      <button data-svc-step="-1" ${svcPos > 0 ? '' : 'disabled'}>Back</button>
      <button data-svc-step="1" ${svcNext ? '' : 'disabled'}>Next</button>
    </div>` : ''}
    <header>
      <span class="bignum">${s.n}</span>
      <h2>${esc(s.title)}</h2>
      <div class="chips">
        ${s.ref ? `<span class="chip">${icons.book}${esc(s.ref)}</span>` : ''}
        ${s.tune ? `<span class="chip">${icons.note}${esc(s.tune)}</span>` : ''}
      </div>
      <div class="acts">
        <button class="pill" data-act="fav" aria-pressed="${favs.has(n)}">${icons.star}Favorite</button>
        <button class="pill" data-act="svc" aria-pressed="${inService}">${inService ? icons.check + 'In service' : icons.list + 'Add to service'}</button>
        ${hasChorus ? `<button class="pill" data-act="repeat" aria-pressed="${repeatChorus}">${icons.repeat}Repeat chorus</button>` : ''}
        <button class="pill" data-act="present">${icons.screen}Present</button>
      </div>
    </header>
    <div class="stanzas">
      ${sections.map(sec => sec.label === 'Chorus'
        ? `<div class="chorus"><span class="clabel">Chorus</span><p>${sec.lines.map(esc).join('<br>')}</p></div>`
        : `<div class="stanza"><span class="vn">${sec.label}</span><p>${sec.lines.map(esc).join('<br>')}</p></div>`).join('')}
    </div>
    <nav class="pager">
      ${prev ? `<button data-n="${prev.n}"><small>← No. ${prev.n}</small><span>${esc(prev.title)}</span></button>` : ''}
      ${next ? `<button class="next" data-n="${next.n}"><small>No. ${next.n} →</small><span>${esc(next.title)}</span></button>` : ''}
    </nav>
    <p class="hint">Swipe left or right to change hymn · The screen stays on while a hymn is open</p>`;
}

$('song').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'), st = e.target.closest('[data-svc-step]');
  if (st) { stepService(+st.dataset.svcStep); return; }
  if (!a) return;
  const n = current;
  if (a.dataset.act === 'fav') {
    favs.has(n) ? favs.delete(n) : favs.add(n);
    saveFavs(); toast(favs.has(n) ? `No. ${n} added to favorites` : `No. ${n} removed from favorites`);
  }
  if (a.dataset.act === 'svc') {
    if (service.includes(n)) { setService(service.filter(x => x !== n)); toast(`No. ${n} removed from the service list`); if (svcPos >= 0) svcPos = -1; }
    else { setService([...service, n]); toast(`No. ${n} added to the service list (${service.length})`); }
  }
  if (a.dataset.act === 'repeat') { repeatChorus = !repeatChorus; store.set('repeat', repeatChorus ? '1' : '0'); }
  if (a.dataset.act === 'present') { present(svcPos >= 0 ? service.slice(svcPos) : [n]); return; }
  const y = window.scrollY; render(n); window.scrollTo(0, y);
});

document.addEventListener('click', e => {
  const b = e.target.closest('.tile, .row, .fav, .pager button, .toc button, #continue');
  if (!b || !b.dataset.n) return;
  closeDialogs();
  open(+b.dataset.n);
});

// Each opened hymn gets a history entry, so the phone's back gesture returns to the list instead of leaving the app.
let homeScroll = 0;
const songFromHash = () => { const m = /^#h(\d+)$/.exec(location.hash); return m ? +m[1] : 0; };
function show(n, pos = -1) {
  if (!song(n)) return false;
  if (!$('home').hidden) homeScroll = window.scrollY;
  svcPos = service[pos] === n ? pos : -1;
  render(n);
  $('home').hidden = true; $('reader').hidden = false;
  window.scrollTo(0, 0);
  store.set('last', n);
  keepAwake(true);
  return true;
}
function showHome() {
  current = 0; svcPos = -1;
  keepAwake(false);
  renderHome();
  $('reader').hidden = true; $('home').hidden = false;
  window.scrollTo(0, homeScroll);
}
function open(n, pos = -1) {
  const fromHome = !$('home').hidden;
  if (!show(n, pos)) return;
  try {
    const state = { song: n, pos: svcPos };
    if (fromHome) history.pushState(state, '', '#h' + n);
    else history.replaceState(state, '', '#h' + n);
  } catch {}
}
function stepService(d) {
  const i = svcPos + d;
  if (svcPos >= 0 && service[i]) open(service[i], i);
}
function step(d) { svcPos >= 0 ? stepService(d) : open(current + d); }
function close() {
  if (history.state && history.state.song) { history.back(); return; }
  showHome();
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
}
window.addEventListener('popstate', () => {
  if (!$('present').hidden) { endPresent(true); return; }
  const n = songFromHash();
  if (!n || !show(n, history.state && history.state.pos != null ? history.state.pos : -1)) showHome();
});
$('back').onclick = close;

/* ---------- Presentation ---------- */
let pres = null;   // { slides, i }
function slidesFor(n) {
  const s = song(n);
  return [{ s, kind: 'title' }, ...sungOrder(s).map(sec => ({ s, kind: sec.label === 'Chorus' ? 'chorus' : 'verse', sec }))];
}
function fitSlide() {
  // largest type size at which the slide still fits the stage
  const box = $('pFit');
  let lo = 14, hi = Math.min(140, innerHeight / 4);
  while (hi - lo > 1) {
    const mid = (lo + hi) / 2;
    box.style.fontSize = mid + 'px';
    if (box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth) hi = mid; else lo = mid;
  }
  box.style.fontSize = lo + 'px';
}
function renderSlide() {
  const { slides, i } = pres, sl = slides[i], s = sl.s;
  $('pTitle').textContent = `No. ${s.n} · ${s.title}`;
  $('pCount').textContent = `${i + 1} / ${slides.length}`;
  $('pBar').style.width = ((i + 1) / slides.length * 100) + '%';
  $('pPrev').disabled = i === 0;
  $('pNext').disabled = i === slides.length - 1;
  $('pFit').innerHTML = sl.kind === 'title'
    ? `<div class="p-num">${s.n}</div><div class="p-title">${esc(s.title)}</div><div class="p-meta">${[s.ref, s.tune && 'Tune: ' + s.tune].filter(Boolean).map(esc).join(' · ')}</div>`
    : `<div class="p-label">${sl.kind === 'chorus' ? 'Chorus' : 'Verse ' + sl.sec.label}</div><div class="p-lines${sl.kind === 'chorus' ? ' it' : ''}">${sl.sec.lines.map(esc).join('<br>')}</div>`;
  fitSlide();
}
function present(list) {
  pres = { slides: list.flatMap(slidesFor), i: 0 };
  $('present').hidden = false;
  document.documentElement.requestFullscreen?.().catch(() => {});
  keepAwake(true);
  try { history.pushState({ ...(history.state || {}), present: true }, '', location.href); } catch {}
  renderSlide();
}
function endPresent(fromHistory) {
  $('present').hidden = true; pres = null;
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  if ($('reader').hidden) keepAwake(false);
  if (!fromHistory) { try { history.back(); } catch {} }
}
function slide(d) {
  if (!pres) return;
  const i = Math.max(0, Math.min(pres.slides.length - 1, pres.i + d));
  if (i !== pres.i) { pres.i = i; renderSlide(); }
}
$('pClose').onclick = () => endPresent(false);
$('pPrev').onclick = () => slide(-1);
$('pNext').onclick = () => slide(1);
$('pStage').addEventListener('click', e => slide(e.clientX < innerWidth / 3 ? -1 : 1));
addEventListener('resize', () => { if (pres) fitSlide(); });

/* ---------- Keyboard and swipe ---------- */
document.addEventListener('keydown', e => {
  if (pres) {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); slide(1); }
    if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); slide(-1); }
    if (e.key === 'Escape') endPresent(false);
    return;
  }
  if (document.querySelector('dialog[open]')) return;
  if ($('reader').hidden) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    return;
  }
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

// Touches that start near a screen edge are left to the system's back gesture.
function onSwipe(el, fn) {
  let t0 = null;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    t0 = (e.touches.length === 1 && t.clientX > 28 && t.clientX < innerWidth - 28) ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (!t0) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    t0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) fn(dx < 0 ? 1 : -1);
  }, { passive: true });
}
onSwipe($('reader'), step);
onSwipe($('pStage'), slide);

if (songFromHash()) show(songFromHash());

if ('serviceWorker' in navigator && location.protocol !== 'file:' && document.querySelector('link[rel="manifest"]')) {
  // When a new version takes over (after an update is published), reload once so it shows right away.
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !pres) location.reload();
    hadController = true;
  });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
